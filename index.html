<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MsMr</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #d8c3a5, #8b5e3c); /* ← نفس ألوان الصورة */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            box-sizing: border-box;
        }

        .container {
            background: rgba(20, 20, 20, 0.85);
            padding: 70px;
            width: 100%;
            max-width: 750px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .logo {
            width: 300px;
            height: 300px;
            background-image: url('logo2.jpeg');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            margin: auto;
            margin-bottom: 40px;

            /* الحد الذهبي */
            border: 6px solid #d4af37;

            /* ظل فاخر */
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
        }

        h2 {
            margin-bottom: 45px;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #d4b08c;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 22px 0;
            padding: 28px;
            border-radius: 22px;
            text-decoration: none;
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn img, .btn svg {
            width: 50px;
            height: 50px;
        }

        .btn:hover {
            transform: scale(1.07);
            opacity: 0.9;
        }

        .snap { background: #FFFC00; color: #000; }
        .tiktok { background: #000; border: 3px solid #ff0050; }
        .insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .appstore { 
            background: #007aff; 
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.4);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
        }
        .appstore img, .appstore svg {
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.3));
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 50px 30px;
                max-width: 95%;
            }

            .logo {
                width: 200px;
                height: 200px;
                margin-bottom: 30px;
            }

            h2 {
                font-size: 32px;
                margin-bottom: 35px;
            }

            .btn {
                padding: 22px;
                font-size: 22px;
                margin: 16px 0;
            }

            .btn img {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo"></div>

    <h2> MsMr </h2>

    <a class="btn snap" href="https://snapchat.com/t/1CJwglDl" target="_blank">
        <img src="https://img.icons8.com/ios-filled/50/000000/snapchat.png" alt="Snapchat">
        سناب شات
    </a>

    <a class="btn tiktok" href="https://www.tiktok.com/@msmr.ksa?_r=1&_t=ZS-95hhZUi6Tll" target="_blank">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/tiktok.png" alt="TikTok">
        تيك توك
    </a>

    <a class="btn insta" href="https://www.instagram.com/msmr.ksa?igsh=a2FudHJuMmcwcjlu&utm_source=qr" target="_blank">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/instagram-new.png" alt="Instagram">
        إنستغرام
    </a>

    <a class="btn appstore" href="https://apps.apple.com/sa/app/%D9%85%D8%B3%D9%85%D8%B1-msmr/id6780955965" target="_blank">
        <svg version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" xml:space="preserve">

</div>

</body>
</html>
